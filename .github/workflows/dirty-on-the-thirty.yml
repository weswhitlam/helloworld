name: Dirty on the Thirty

on:
  schedule:
    # GitHub cron is UTC only. 07:05 UTC is 3:05 AM EDT; 08:05 UTC is 3:05 AM EST.
    # The script sends only once per Eastern day, at or after 3 AM, so one of these is a no-op.
    - cron: '5 7 * * *'
    - cron: '5 8 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Send now, even if today''s briefing already went out'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: dirty-on-the-thirty
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dirty-on-the-thirty
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dirty-on-the-thirty/package-lock.json

      - run: npm ci

      - name: Build and send briefing
        run: node src/index.js
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENTS: ${{ secrets.RECIPIENTS }}
          FORCE_SEND: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}

      - name: Save sent-story history
        run: |
          if git diff --quiet -- state/sent-stories.json; then
            echo "No state changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/sent-stories.json
          git commit -m "Update Dirty on the Thirty sent-story history [skip ci]"
          git push
